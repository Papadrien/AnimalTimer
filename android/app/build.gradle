plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// ✅ Signing : charger key.properties si présent (CI ou local)
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ✅ Lire versionCode/versionName depuis Flutter (pubspec.yaml)
// flutter.versionCode peut être une String — on le convertit en int
def flutterVersionCode = flutter.versionCode?.toInteger() ?: 1
def flutterVersionName = flutter.versionName ?: "1.0.0"

android {
    namespace "fr.junade.animaltimer"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        applicationId "fr.junade.animaltimer"
        minSdkVersion 23
        targetSdk 36
        versionCode flutterVersionCode
        versionName flutterVersionName
        multiDexEnabled true
    }

    // ✅ Signing config conditionnel
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // ⚠️ Ne PAS forcer billingclient ici : in_app_purchase_android (0.5.0+2)
    // est compilé contre l'API Billing 8.0.0. Un forçage vers 9.x crée un
    // décalage binaire (le plugin appelle des méthodes dont le contrat a
    // changé) → BillingClient.startConnection() ne rappelle jamais
    // onBillingSetupFinished, et purchaseServiceProvider.initialize() reste
    // bloqué pour toujours sur le splash screen, sans aucune exception.
    // → Vérifier sur pub.dev si une version plus récente de
    //   in_app_purchase_android embarque nativement Billing 9.x avant de
    //   retenter ce forçage.
}

flutter { source '../..' }
